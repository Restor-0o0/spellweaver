name: Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build
      - id: meta
        run: echo "version=$(grep '^mod_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"
      - id: notes
        run: |
          git fetch --force origin "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          {
            echo 'text<<CHANGELOG_EOF'
            git tag -l --format='%(contents)' "$GITHUB_REF_NAME"
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"
      - uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: WN5er9NK
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: 1759626
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: ${{ github.ref_name }}
          files: build/libs/!(*-secret).jar
          changelog: ${{ steps.notes.outputs.text }}
          name: Spellweaver ${{ steps.meta.outputs.version }} (Forge 1.20.1)
          version: ${{ steps.meta.outputs.version }}+forge-1.20.1
          version-type: release
          loaders: forge
          game-versions: 1.20.1
          java: 17
          dependencies: |
            cataclysm(optional){modrinth:46KJle7n}{curseforge:l_enders-cataclysm}#(ignore:github)
            mowziesmobs(optional){modrinth:BFbX9xcm}{curseforge:mowzies-mobs}#(ignore:github)
            dungeons_arise(optional){modrinth:8DfbfASn}{curseforge:when-dungeons-arise}#(ignore:github)
            betterdungeons(optional){modrinth:o1C1Dkj5}{curseforge:yungs-better-dungeons}#(ignore:github)
            aquamirae(optional){modrinth:k23mNPhZ}{curseforge:aquamirae}#(ignore:github)
