name: Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build
      - id: meta
        run: echo "version=$(grep '^mod_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"
      - id: notes
        run: |
          git fetch --force origin "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          {
            echo 'text<<CHANGELOG_EOF'
            git tag -l --format='%(contents)' "$GITHUB_REF_NAME"
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"
      - uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: WN5er9NK
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: 1759626
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: ${{ github.ref_name }}
          files: build/libs/!(*-secret).jar
          changelog: ${{ steps.notes.outputs.text }}
          name: Spellweaver ${{ steps.meta.outputs.version }} (NeoForge 26.2)
          version: ${{ steps.meta.outputs.version }}+neoforge-26.2
          version-type: release
          loaders: neoforge
          game-versions: 26.2
          java: 25
